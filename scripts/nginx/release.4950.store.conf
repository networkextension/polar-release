# release.4950.store — polar-release portal + API (release-svc :8101)
#
# release-svc serves BOTH the self-contained admin portal (GET /) and the
# API (/release/*, /healthz) from one Go backend, so everything proxies to
# :8101. Admin writes (yank/promote/list) authenticate via the shared
# access_token cookie (dock sets Domain=.4950.store) — same-origin here, so
# the cookie rides along automatically. No static root, no dock /api fan-out.
#
# Shares the wildcard *.4950.store cert; DNS wildcard already resolves.
# Public access: :2443 (router hairpin). Internal: :443.
#
# Install: bootstrap-release.sh copies this to
#   /opt/homebrew/etc/nginx/servers/release.4950.store.conf
# then `nginx -t && nginx -s reload`.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name release.4950.store;

  ssl_certificate     /Users/local/etc/letsencrypt/live/4950.store/fullchain.pem;
  ssl_certificate_key /Users/local/etc/letsencrypt/live/4950.store/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  client_max_body_size 16M;

  location / {
    proxy_pass http://127.0.0.1:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
